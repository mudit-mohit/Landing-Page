name: Deploy React App to Hostinger

on:
  push:
    branches:
      - main # Change this to 'master' if your main branch is named master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Build the Project (Creates the 'dist' folder)
      - name: Build Project
        run: npm run build

      # 5. Verify head snippets made it into dist/index.html before upload
      - name: Verify dist/index.html contains expected snippets
        run: |
          echo "----- dist/index.html (head/body markers) -----"
          grep -nE "pixel|expertise|reb2b" dist/index.html || (echo "ERROR: expected snippets missing from built index.html" && exit 1)

      # 6. Upload 'dist' folder to Hostinger.
      #    server-dir is ./ because the FTP user is chrooted directly
      #    into the webroot for outmate.ai. Uploading to ./public_html/
      #    creates a ghost subdir inside the webroot that is never served.
      #    dangerous-clean-slate is deliberately OFF -- with sync state
      #    intact, only changed files upload, and a mid-deploy failure
      #    cannot blank the live site.
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          protocol: ftps
          port: 21
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            public_html/**
            DO_NOT_UPLOAD_HERE

      # 7. Verify live site now serves the expected snippets.
      #    Fails the workflow loudly if FTP "succeeded" but the live
      #    HTML still doesn't contain the pixel / expertise tags.
      - name: Verify live site contains expected snippets
        run: |
          sleep 5
          echo "----- curl https://outmate.ai/ -----"
          BODY=$(curl -fsS "https://outmate.ai/?cachebust=${GITHUB_SHA}")
          echo "$BODY" | grep -nE "pixel|expertise|reb2b" || (echo "ERROR: live site missing expected snippets after deploy" && exit 1)
