name: Deploy React App to Hostinger

on:
  push:
    branches:
      - main # Change this to 'master' if your main branch is named master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Build the Project (Creates the 'dist' folder)
      - name: Build Project
        run: npm run build

      # 5. Verify head snippets made it into dist/index.html before upload
      - name: Verify dist/index.html contains expected snippets
        run: |
          echo "----- dist/index.html (head/body markers) -----"
          grep -nE "pixel|expertise|reb2b" dist/index.html || (echo "ERROR: expected snippets missing from built index.html" && exit 1)

      # 6. Upload 'dist' to Hostinger webroot via lftp mirror.
      #    We use lftp (not SamKirkland/FTP-Deploy-Action) because that
      #    action's basic-ftp client times out against Hostinger's
      #    explicit-FTPS endpoint, while lftp connects reliably with the
      #    exact settings proven by the earlier filesystem probe.
      #    Target is ./ because the FTP user is chrooted into the webroot;
      #    uploading to ./public_html/ would create a never-served ghost
      #    subdir. mirror -R --delete keeps the server in sync with dist/
      #    while protecting the ghost dir and the Hostinger marker file.
      - name: FTP Deploy (lftp mirror)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          cat > /tmp/deploy.cmds <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-protect-data true
          set ftp:ssl-force true
          set ftp:passive-mode true
          set net:max-retries 2
          set net:timeout 30
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:21"
          mirror -R --verbose \
            --exclude-glob .git* \
            --exclude-glob node_modules/ \
            --exclude public_html/ \
            --exclude DO_NOT_UPLOAD_HERE \
            --exclude .ftp-deploy-sync-state.json \
            ./dist/ ./
          bye
          EOF

          lftp -f /tmp/deploy.cmds

      # 7. Verify live site now serves the expected snippets.
      #    Fails the workflow loudly if FTP "succeeded" but the live
      #    HTML still doesn't contain the pixel / expertise tags.
      - name: Verify live site contains expected snippets
        run: |
          sleep 5
          echo "----- curl https://outmate.ai/ -----"
          BODY=$(curl -fsS "https://outmate.ai/?cachebust=${GITHUB_SHA}")
          echo "$BODY" | grep -nE "pixel|expertise|reb2b" || (echo "ERROR: live site missing expected snippets after deploy" && exit 1)
