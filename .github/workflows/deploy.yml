name: Deploy React App to Hostinger

on:
  push:
    branches:
      - main # Change this to 'master' if your main branch is named master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Build the Project (Creates the 'dist' folder)
      - name: Build Project
        run: npm run build

      # 5. Verify head snippets made it into dist/index.html
      - name: Verify dist/index.html contains expected snippets
        run: |
          echo "----- dist/index.html (head/body markers) -----"
          grep -nE "pixel|expertise|reb2b" dist/index.html || (echo "ERROR: expected snippets missing from built index.html" && exit 1)

      # 6. DIAGNOSTIC: probe FTP filesystem to find the real webroot.
      #    Lists likely Hostinger paths so we can see which directory
      #    actually serves outmate.ai. Read the run log for the answer.
      - name: Probe FTP filesystem for real webroot
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" \
               -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; set ftp:ssl-force true;
                   echo '===== pwd (landing dir) ====='; pwd;
                   echo '===== ls of landing dir ====='; cls -l;
                   echo '===== ls / ====='; cls -l /;
                   echo '===== ls /domains (if any) ====='; cls -l /domains || true;
                   echo '===== ls /domains/outmate.ai (if any) ====='; cls -l /domains/outmate.ai || true;
                   echo '===== ls /domains/outmate.ai/public_html (if any) ====='; cls -l /domains/outmate.ai/public_html || true;
                   echo '===== ls /public_html (if any) ====='; cls -l /public_html || true;
                   echo '===== ls /home (if any) ====='; cls -l /home || true;
                   bye" "ftps://$FTP_SERVER" || true

      # 7. Upload 'dist' folder to Hostinger
      #    TEMPORARILY DISABLED while diagnosing webroot path.
      #    Re-enable once server-dir is correct, and reconsider
      #    dangerous-clean-slate (it wipes the site before re-upload).
      # - name: FTP Deploy
      #   uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      #   with:
      #     server: ${{ secrets.FTP_SERVER }}
      #     username: ${{ secrets.FTP_USERNAME }}
      #     password: ${{ secrets.FTP_PASSWORD }}
      #     local-dir: ./dist/
      #     server-dir: ./public_html/
      #     protocol: ftps
      #     port: 21
      #     security: loose
